[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marquez-lineage"
version = "0.2.0"
description = "A small Marquez client and CLI for efficient table lineage traversal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
marquez-lineage = "marquez_lineage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
