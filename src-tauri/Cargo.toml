[package]
name = "gala"
version = "0.1.0-alpha.1"
description = "Local photo view engine desktop app"
authors = ["Gala"]
edition = "2021"

[lib]
name = "gala_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
image = "0.25"
base64 = "0.22"
kamadak-exif = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-util = "0.7"
async-trait = "0.1"
hnsw_rs = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSURL",
  "NSError",
  "NSString",
  "NSArray",
  "NSValue",
  "NSGeometry",
  "NSData",
] }
objc2-app-kit = { version = "0.3", features = ["NSImage"] }
objc2-core-foundation = { version = "0.3", features = [
  "CFDictionary",
  "CFNumber",
  "CFString",
  "CFURL",
] }
objc2-core-graphics = "0.3"
objc2-image-io = { version = "0.3", features = [
  "CGImageDestination",
  "CGImageSource",
  "objc2-core-graphics",
] }
objc2-photos = { version = "0.3", features = ["objc2-image-io"] }
objc2-vision = { version = "0.3", features = [
  "VNRequest",
  "VNRequestHandler",
  "VNDetectFaceRectanglesRequest",
  "VNClassifyImageRequest",
  "VNGenerateImageFeaturePrintRequest",
  "VNObservation",
  "VNTypes",
  "VNGeometry",
  "objc2-core-foundation",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "test-util"] }
